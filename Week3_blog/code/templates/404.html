<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>404 — Page Not Found</title>
  <meta name="description" content="Sorry, the page you’re looking for doesn’t exist." />
  <style>
    :root{
      --bg: #0b1220;
      --card: rgba(255,255,255,.06);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --border: rgba(255,255,255,.12);
      --accent: #7c3aed; /* purple */
      --accent2:#22d3ee; /* cyan */
      --shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f6f7fb;
        --card: rgba(0,0,0,.04);
        --text: rgba(0,0,0,.9);
        --muted: rgba(0,0,0,.62);
        --border: rgba(0,0,0,.10);
        --shadow: 0 18px 50px rgba(0,0,0,.12);
      }
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1200px 800px at 20% 20%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 60%),
        radial-gradient(900px 650px at 80% 30%, color-mix(in srgb, var(--accent2) 25%, transparent), transparent 60%),
        radial-gradient(700px 500px at 50% 90%, rgba(255,255,255,.06), transparent 60%),
        var(--bg);
      color: var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 28px 16px;
    }

    .wrap{
      width:min(980px, 100%);
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 18px;
      align-items: stretch;
    }
    @media (max-width: 820px){
      .wrap{grid-template-columns: 1fr}
    }

    .card{
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 26px;
      position:relative;
      overflow:hidden;
      backdrop-filter: blur(10px);
    }

    .badge{
      display:inline-flex;
      gap:10px;
      align-items:center;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      font-weight: 600;
      letter-spacing: .2px;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    h1{
      margin: 14px 0 6px;
      font-size: clamp(36px, 5vw, 54px);
      line-height:1.05;
    }
    p{
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      max-width: 60ch;
    }

    .actions{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
      align-items:center;
    }
    a.btn, button.btn{
      appearance:none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      text-decoration:none;
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 650;
      display:inline-flex;
      align-items:center;
      gap: 10px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    a.btn:hover, button.btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.10);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    }
    a.primary{
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 85%, #000), color-mix(in srgb, var(--accent2) 70%, #000));
      border-color: transparent;
      color: white;
    }
    a.primary:hover{filter:saturate(1.1) brightness(1.02)}

    .hint{
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    code{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: inherit;
    }

    /* Right panel: big “404” */
    .visual{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 220px;
    }
    .num{
      font-size: clamp(96px, 13vw, 160px);
      font-weight: 900;
      letter-spacing: -6px;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,.28));
      user-select:none;
    }
    .ring{
      position:absolute;
      inset:-80px -120px auto auto;
      width: 260px;height:260px;border-radius:50%;
      border: 2px solid color-mix(in srgb, var(--accent2) 40%, transparent);
      opacity:.35;
      transform: rotate(12deg);
    }
    .ring2{
      position:absolute;
      inset:auto auto -120px -120px;
      width: 320px;height:320px;border-radius:50%;
      border: 2px solid color-mix(in srgb, var(--accent) 35%, transparent);
      opacity:.25;
    }
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-labelledby="title">
    <section class="card">
      <div class="ring" aria-hidden="true"></div>
      <div class="ring2" aria-hidden="true"></div>

      <div class="badge"><span class="dot" aria-hidden="true"></span> Error 404</div>
      <h1 id="title">Page not found</h1>
      <p>
        The page you’re looking for doesn’t exist, was moved, or the URL was typed incorrectly.
      </p>

      <div class="actions">
        <a class="btn primary" href="/" aria-label="Go back home">
          <!-- icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5.5 10.5V20h13V10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Home
        </a>

        <a class="btn" href="javascript:history.back()" aria-label="Go back to previous page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Go back
        </a>

        <a class="btn" href="/contact" aria-label="Contact support">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 4h16v12H5.5L4 17.5V4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M8 20h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Contact
        </a>
      </div>

      <div class="hint">
        Tip: check the URL, or try the site search (if you have one). Requested: <code id="path"></code>
      </div>
    </section>

    <section class="card visual" aria-hidden="true">
      <div class="num">404</div>
    </section>
  </main>

  <script>
    // Display the requested path (helpful in logs/screenshots)
    document.getElementById("path").textContent = location.pathname || "/";
  </script>
</body>
</html>
