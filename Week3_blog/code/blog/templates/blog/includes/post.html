{% load static %}

<li>
  <article class="post">
    <a href="{%url "post-detail-page" post.slug%}">
    {% comment %} <a href="{%url "post-detail-page" slug='the-mountains'%}"> {% endcomment %}
      <img src="{% static "blog/images/"|add:post.image %}" alt="{{post.title}}" />
      {% comment %} <img src="{% static "blog/images/mountains.jpg" %}" alt="Mountain Hiking" /> {% endcomment %}
      <div class="post__content">
        <h3>{{ post.title}}</h3>
        <p>
          {{post.excerpt}}
        </p>
      </div>
    </a>
  </article>
</li>
